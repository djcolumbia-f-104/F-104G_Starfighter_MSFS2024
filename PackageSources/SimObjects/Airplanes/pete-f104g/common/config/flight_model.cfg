; F-104G Starfighter: Flugmodell (QUELLDATEI)
; tools/merge_cfg.py legt diese Werte über die SDK-Vorlage (SimpleAircraft) -> common/config/flight_model.cfg.
; Hier stehen nur F-104-Werte; alles andere kommt unverändert aus der Vorlage.
; Herleitung aller Zahlen: docs/flight-model-values.md. Tabellen erzeugt mit tools/fm_calc.py.
; Bezugspunkt (Datum): 25 % MAC = Rumpfstation F.S. 472.5 in, Höhe W.L. 100 (Rumpfbezugslinie), Mitte.
; Achsen: z vorn positiv, x rechts positiv, y oben positiv; Einheiten ft, lb, slug*ft^2.
; [Q] = Quelle belegt, [M] = aus Dreiseitenansicht CR-2144 gemessen (ca. +-1 ft), [S] = Schätzung.

; GENERIERT von tools/merge_cfg.py - nicht direkt bearbeiten, sondern source/cfg/ ändern.

