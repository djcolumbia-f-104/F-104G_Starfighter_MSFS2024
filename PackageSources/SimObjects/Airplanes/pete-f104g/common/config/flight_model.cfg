; Rudder (AP-6): MSFS rotates fin + rudder as ONE surface by the rudder deflection -> equilibrium β = δr (round A:
; 5.84/5.87°, 6.59/6.59°). Real flap-type rudder: effective share = Cnδr/Cnβ = 0.16/0.50 = 0.32 (CR-2144 approach).
; SDK: rudder_maxangle_scalar < 1, "effective deflection aligned with the overall vtail and rudder chord".
; AP-11: with the weaker fin the sideslip per effective rudder rises to ≈ fin/(fin - fuselage) ≈ 1.35 -> scalar
; 0.32/1.35 ≈ 0.24 to keep β/δr = 0.32 (T3-E). Re-measure with the doublet flight.
rudder_maxangle_scalar = 0.32     ; [M] AP-11 iteration 2: 0.24 x 0.32/0.26 / 0.93 (stiffer fin)
elevator_maxangle_scalar = 1      ; [Q] all-moving tail: the whole surface moves (FM 6-3), hence 1 (SDK hint 0.5-0.75 applies to flap-type elevators)

