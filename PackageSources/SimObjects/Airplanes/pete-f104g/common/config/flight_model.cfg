; Hinterkantenklappen mit BLC; Stellungen UP / TAKEOFF / LAND (FM 1-71)
                                  ; Hydrauliksystem im Template -> Klappen fuhren nie aus (T3-D Lauf 5: Hebel 1, Winkel 0°)
; AP-10 (T3-D 2026-10-25): SDK-Formel Klappenauftrieb = lift_coef_flaps x lift scalar x Ausschlag im BOGENMASS, und
; "add incidence" (Standard 0,5) gibt bei α 0 nur die Hälfte -> bisher TAKEOFF ~0,13 bei 10°, LAND ~0,28 im Anflug.
; Werte je Stellung: Winkel, Fahrtgrenze, drag scalar, lift scalar, area scalar, add camber, add aft feet, add incidence.
; FM 1-73: TAKEOFF = Vorder- und Hinterkante je 15°, LAND = Vorderkante 30°/Hinterkante 45°, BLC nur bei LAND.
; LAND: ΔCL 0,62 (CR-2144 Anflug) -> lift scalar 0,62/(0,62 x 0,785) = 1,273; drag ebenso 1,273 -> ΔCD 0,12
; TAKEOFF: ΔCL 0,30 aus FM Fig. A2-3 (Abheben 174 kt bei 18 155 lb, CL 0,90; Sim ohne Klappenanteil 0,565 bei 10,6°
; Nicklage, Lauf 4) -> lift scalar 0,30/(0,62 x 0,262) = 1,847

