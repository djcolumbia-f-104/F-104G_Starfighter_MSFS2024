; Auftrieb: NASA TN D-7137 Table 1 (M 0.4, 0..14 Grad gemessen); >14 Grad und negativ: Schätzung (Pitch-up)
; Machskalierung: CL bei 6 Grad relativ zu M 0.4 (D-7137). Prüfen, ob MSFS Kompressibilität schon selbst rechnet.
lift_coef_at_drag_zero = 0        ; [Q] Polare D-7137 symmetrisch (CD-Minimum bei CL = 0); Pflichtparameter
; AP-1b (A/B-Test): FSX-Altterme der Vorlage auf 0 (cfg-Referenz: im modernen FM unbenutzt; Physik-Primer: in der
; Auftriebsgleichung). Vorlage: -0.372559 / -0.567871 / -3.899902 / 1.699707
; Pendelleitwerk-Auftriebsanstieg auf Leitwerksfläche: CR-96008 CLδe 1,015/rad (M 0,84) x 196,1/48,2 = 4,1 (AP-2)
elevator_lift_coef = 4.1          ; [Q] Bereich 2,8 (CR-2144 Anflug) .. 4,4 (CR-96008 M 1,0)
; Seitenruder (AP-6): rudder_lift_coef ist der Auftriebsanstieg der GANZEN Seitenleitwerksfläche (auch Richtungsstabilität).
; Runde B2: mit 1,6 brach der Jet bei vollem Ruder aus (β 30°, β/δr ≈ 2) -> zurück auf Standard; rudder_effectiveness 0,32 ohne messbare Wirkung
; (Runde C) -> wieder entfernt. Seitliche Abstimmung über Geometrie: AP-6 neu (flight-model-plan.md)
rudder_lift_coef = 5.0            ; [S] SDK-Standard
; Zusatzwiderstand über Mach = CD0(M) - CD0 (D-7137 Table 2, Spalte CL = 0)
; Landeanflug CR-2144 (Klappen 45 Grad + BLC, Fahrwerk aus): CL 0.735 bei alpha 2.3 Grad (clean: 0.115),
; CD 0.263 (clean bei CL 0.735: 0.016 + 0.194*0.735^2 = 0.121) -> Klappen+Fahrwerk dCL 0.62, dCD 0.142

