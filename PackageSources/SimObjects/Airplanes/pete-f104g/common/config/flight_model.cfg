flaps-position.2 = 45, 240, 0.85, 0.6, 1, 0, 0, 1  ; [Q/M] LAND TE 45°, limit 240 KIAS (FM 5-5); drag scalar 0.85 -> ΔCD 0.08 (FM B5/B6)
; Trailing edge flaps with BLC; positions UP / TAKEOFF / LAND (FM 1-71)
                                  ; hydraulic system in the template -> flaps never extended (T3-D run 5: lever 1, angle 0°)
; 2026-10-28 (dry run 16): damaging-speed applies to ANY extended position (SDK). 240 (the LAND limit) damaged the
; TAKEOFF flaps in the FM go-around (TAKEOFF ≥ 180 KIAS, UP at ≥ 260 KIAS) -> flaps stuck at 15° up to 545 KIAS.
; FM 3-36: TAKEOFF flaps may be extended at any speed below 370 KIAS; LAND 240 KIAS (FM 5-5) as position limit.
; AP-10 (T3-D 2026-10-25): SDK formula flap lift = lift_coef_flaps x lift scalar x deflection in RADIANS, and
; "add incidence" (default 0.5) gives only half at α 0 -> so far TAKEOFF ~0.13 at 10°, LAND ~0.28 on approach.
; Values per position: angle, speed limit, drag scalar, lift scalar, area scalar, add camber, add aft feet, add incidence.
; FM 1-73: TAKEOFF = leading and trailing edge 15° each, LAND = leading edge 30°/trailing edge 45°, BLC only in LAND.
; LAND: ΔCL 0.62 (CR-2144 approach) -> lift scalar 0.62/(0.62 x 0.785) = 1.273; drag likewise 1.273 -> ΔCD 0.12
; TAKEOFF: ΔCL 0.30 from FM Fig. A2-3 (liftoff 174 kt at 18 155 lb, CL 0.90; sim without flap share 0.565 at 10.6°
; pitch, run 4) -> lift scalar 0.30/(0.62 x 0.262) = 1.847
; T3-L 2026-10-26 (debug windows "Sim Curves"/"Stall"): MSFS models a flap as an incidence increment of the flapped wing
; section that grows with angle x lift scalar (TAKEOFF 15° x 1.847 -> +17.1°, works: FinClAOA0 0.3095 = target 0.3093).
; LAND 45° x 1.273..2.0 gave +35..60° -> section fully stalled ("Middle wing AOA -14°", RawClAOA0 0.01, FinClAOA0
; 0.22 vs. target 0.98): no flap lift, only drag and a strong nose-down moment. Runs 1-5 explained.
; New split (FM 1-73: TE + LE flaps): TE LAND scalar 0.6 (+~17° like TAKEOFF), TE TAKEOFF 0.84; the LE flaps
; ([FLAPS.1], 15°/30°, system lift scalar 1.01) supply the rest. Targets: TAKEOFF 0.62 x 0.262 x (0.84 + 1.01) = 0.30,
; LAND 0.62 x (0.785 x 0.6 + 0.524 x 1.01) = 0.62. add aft feet back to 0 (moment came from the stalled section).
; 2026-10-29 (B4 glide, ISA): FM Fig. 3-8 - TAKEOFF flaps 245 KIAS and flaps up 275 KIAS give the SAME glide distance.
; Sim: clean 6.42 (10.6 NM/10 000 ft, FM no-RAT ≈ 11 ✓) but TAKEOFF 5.15 (8.5 NM) -> TAKEOFF flap drag too high by
; ≈ 736 lbf at 205 psf = ΔCD 0.018 -> flap ΔCD 0.031 -> 0.013: drag scalar 0.013/(0.12 x 0.262) = 0.42 (was 1).
; 2026-10-28 (B5/B6, measurements.md): the CR-2144 approach polar (ΔCD 0.142 flaps + gear) gives ≈ 0.04 more drag than
; three flight-tested FM points: go-around climb Fig. 6-8 (sim +389 vs. ≈ 1 200-1 400 ft/min), flat final with speed
; brakes at Military FM 3-41 (sim 164 vs. 190-200 KIAS), approach rpm Fig. 2-7 (91 vs. 87-90 %). Thrust only -5 %.
; -> LAND flap ΔCD 0.12 -> 0.08: drag scalar 0.08/(0.12 x 0.785) = 0.85 (was 1.273). Gear 0.022 unchanged.

