; Wheel brakes (template SimpleAircraft 0.68, never tuned). 2026-10-28 landings in calm weather (F2/F3, clear skies,
; wind 1 kt, ISA): ground roll +20 % (no chute, 4 292 ft from 178 KIAS) and +24 % (chute) vs. FM Fig. A8-4/A8-3
; (hard braking, anti-skid). Mean deceleration 0.33 g vs. FM 0.39 g; aero drag at idle ≈ 0.07 g, idle thrust
; ≈ -0.03 g -> brake share 0.29 g vs. ≈ 0.35 g needed -> x 1.2. (Earlier landings 7/8 looked fine only with live
; weather headwind.)

