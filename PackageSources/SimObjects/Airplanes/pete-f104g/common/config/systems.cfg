; Stability augmenter: FM 6-3 (Fig. 6-1) - yaw and roll oscillations are "completely damped" with SAS; the SAS
; is always on in normal flight. MSFS models this with the autopilot yaw damper (AP-6).
; Round D 2026-10-25: with gain 1.0 the yaw damper applied rudder by itself (2.5°) and rolled the jet up to 66° bank
; on positioned flights; without it the AP wing leveler held at once. Template default is 0 (off).
; Round F (T3-J): cautious gain 0.3; only active after YAW_DAMPER_ON, so other tests are unaffected. Test: rudder
; doublet with the yaw damper off/on (Dutch roll damping) and a 30° bank hold (no roll-off).
; 2026-10-26 (after AP-11): gain 0.3 had no effect (amplitude ratio 0.62 vs. 0.57 off); gain 1.0 also no extra
; damping in the doublet, but ~15 s later the jet departed by itself (β 40-180°, yaw rate 270°/s, crash) - as in
; round D. The MSFS AP yaw damper is not usable as the F-104 SAS -> OFF. Natural Dutch roll damping (0.57/cycle)
; is close to CR-2144 SAS off (0.43/cycle). A real SAS would need own logic (WASM/XML), later.
yaw_damper_rudder_gain = 0.0      ; [M] off, see above
; Pitch rate of the autopilot: template 2°/s (light aircraft). After repositioning (α = 0) the jet sank up to
; 6 500 ft before the AP had raised the nose (rounds D/E). A fighter pitches much faster -> 5°/s [S], test aid.
; 2026-10-27 landing dry runs (simlog): the AP flew pitch by TRIM only, ~0.13°/s, plus the template's 1°/s² pitch
; acceleration limit -> ~30 s to reach the approach α after repositioning, the jet sank 2 500-4 000 ft/min meanwhile
; (even in ALT hold); a trim preset was overwritten by the AP at once. The F-104 has an all-moving tail - trim and
; elevator move the same stabilizer - so letting the AP command the elevator is physically equivalent and responsive.
; TRIED (dry runs 3/4) and REVERTED: with pitch_use_elevator_only = 1 the AP set the trim to 0 on engagement and
; commanded only ~1.4-3° elevator -> α ≈ 0-1°, dive. Isolated test: with the AP engaged the trim is locked (event,
; SimVar, trim switch ignored); with the AP off the SimVar ELEVATOR_TRIM_POSITION can be set. Solution in the
; scripts: AP off -> preset trim -> AP on (trim-based AP then only fine-tunes). Template defaults kept.

