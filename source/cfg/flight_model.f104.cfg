[FLIGHT_TUNING]
modern_fm_only = 1                ; immer modernes Flugmodell, unabhängig von den Sim-Optionen (SDK)
; Seitenruder (AP-6): MSFS dreht Flosse + Ruder als EINE Fläche um den Ruderausschlag -> Gleichgewicht β = δr (Runde A:
; 5,84/5,87°, 6,59/6,59°). Echtes Klappenruder: wirksamer Anteil = Cnδr/Cnβ = 0,16/0,50 = 0,32 (CR-2144 Anflug).
; SDK: rudder_maxangle_scalar < 1, "effective deflection aligned with the overall vtail and rudder chord".
rudder_maxangle_scalar = 0.32     ; [M/Q] T3-E Runde A + CR-2144
elevator_maxangle_scalar = 1      ; [Q] Pendelleitwerk: ganze Fläche bewegt sich (FM 6-3), daher 1 (SDK-Hinweis 0,5-0,75 gilt für Klappenruder)

