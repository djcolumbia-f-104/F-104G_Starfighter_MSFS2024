; Modelled as MSFS spoilers without lift loss (fuselage brakes, not on the wing); aerodynamics see [AERODYNAMICS].
; 2026-10-31 H5 experiment: the coast-down test showed that on the ground MSFS applies the AIR spoiler drag (ΔCD 0.042) and
