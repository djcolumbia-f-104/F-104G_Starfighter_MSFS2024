; Approach CR-2144 (flaps 45 degrees + BLC, gear down): CL 0.735 at alpha 2.3 degrees (clean: 0.115),
; CD 0.263 (clean at CL 0.735: 0.016 + 0.194*0.735^2 = 0.121) -> flaps + gear dCL 0.62, dCD 0.142
lift_coef_flaps = 0.62            ; [Q/calculated]
drag_coef_flaps = 0.12            ; [Q/calculated] 0.142 minus gear
drag_coef_gear = 0.022            ; [S] gear share of 0.142
; Speed brakes (S11e): flat plate CD ≈ 1.0 on the projected area 8.25 ft² -> ΔCD = 8.25/196.1 = 0.042 (wing reference).
; SDK: the value is multiplied by the deflection in RADIANS (as the flaps) -> 0.042/0.908 (52°) = 0.046.
; No lift change (fuselage brakes). Test: deceleration at 400 kt with/without speed brakes (ΔCD from analyse_drag.py).
; Drag chute (no MSFS parameter): emulated with the GROUND spoiler drag - the speed brake handle after touchdown also
; 'deploys' the chute. 18-ft ring-slot chute (FM Fig. A8-3), CD ≈ 0.5 on 254 ft² nominal area -> ΔCD ≈ 0.65 (wing ref.)
; + speed brakes 0.042 -> (0.042 + 0.65)/0.908 = 0.76 [S]. Limits: deploy ≤ 180 KIAS (MB-7G) / 205 KIAS (BS-4000), FM 5-5.
; In the air drag_coef_air_spoilers (speed brakes only) applies.
; 2026-10-27: FM Fig. A8-3/A8-4 read carefully (17 900 lb, 1 500 ft, 12 °C, no wind): ground roll 2 760 ft with chute vs.
; 3 130 ft without (-12 %, braking dominates). Energy balance (mean q ≈ half the touchdown q): chute ΔCD ≈ 0.10-0.15
; -> (0.042 + 0.15)/0.908 = 0.21 [M/S], to be calibrated with the landing test (target 2 760 ft).
; 2026-10-28 calm-weather landings (wind 1 kt, ISA, toe_brakes_scale 0.82): no chute +9 % (✓), chute +20 % vs. FM;
; deceleration with vs. without chute only +1..1.5 ft/s² at 100-160 kt -> effective ΔCD ≈ 0.066, i.e. MSFS applies only
; ≈ 1/3 of the configured ground spoiler drag (0.21 x 0.908 = 0.19). FM chute effect -12 % needs ≈ +0.07 effective
; -> 0.21 x (0.066 + 0.07)/0.066 ≈ 0.43.
; 2026-10-31 H5 (coast-down tests, tools/coast_test.py): with spoiler_limit = air_spoiler_limit (52°) MSFS applied only the
; air spoiler drag on the ground (ΔCD 0.042) - this value had NO effect; with the ground limit above the air limit it is
; added: 65° -> 1.03 x, 90° -> 1.28 x drag_coef_spoilers (0.43 gave ΔCD 0.44 / 0.55). Chute target ≈ +0.12 (FM -12 %).
drag_coef_spoilers = 0.12         ; [M/S] drag chute emulation with spoiler_limit 65° (FM A8-3 vs. A8-4, verify with F2)
drag_coef_air_spoilers = 0.046    ; [S] ditto in the air
lift_coef_spoilers = 0            ; [Q] no lift loss (fuselage, not wing)
lift_coef_air_spoilers = 0        ; [Q] ditto

[FLIGHT_TUNING]
modern_fm_only = 1                ; always the modern flight model, independent of the sim options (SDK)
; Rudder (AP-6): MSFS rotates fin + rudder as ONE surface by the rudder deflection -> equilibrium β = δr (round A:
; 5.84/5.87°, 6.59/6.59°). Real flap-type rudder: effective share = Cnδr/Cnβ = 0.16/0.50 = 0.32 (CR-2144 approach).
; SDK: rudder_maxangle_scalar < 1, "effective deflection aligned with the overall vtail and rudder chord".
; AP-11: with the weaker fin the sideslip per effective rudder rises to ≈ fin/(fin - fuselage) ≈ 1.35 -> scalar
; 0.32/1.35 ≈ 0.24 to keep β/δr = 0.32 (T3-E). Re-measure with the doublet flight.
rudder_maxangle_scalar = 0.32     ; [M] AP-11 iteration 2: 0.24 x 0.32/0.26 / 0.93 (stiffer fin)
elevator_maxangle_scalar = 1      ; [Q] all-moving tail: the whole surface moves (FM 6-3), hence 1 (SDK hint 0.5-0.75 applies to flap-type elevators)

