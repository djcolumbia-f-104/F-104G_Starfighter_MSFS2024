; F-104G Starfighter: flight model (SOURCE FILE)
; tools/merge_cfg.py lays these values over the SDK template (SimpleAircraft) -> common/config/flight_model.cfg.
; Only F-104 values live here; everything else comes unchanged from the template.
; Derivation of all numbers: docs/flight-model-values.md. Tables generated with tools/fm_calc.py.
; Reference point (datum): 25 % MAC = fuselage station F.S. 472.5 in, height W.L. 100 (fuselage reference line), centre.
; Axes: z forward positive, x right positive, y up positive; units ft, lb, slug*ft^2.
; [Q] = backed by a source, [M] = measured on the CR-2144 three-view (approx. +-1 ft), [S] = estimate.

