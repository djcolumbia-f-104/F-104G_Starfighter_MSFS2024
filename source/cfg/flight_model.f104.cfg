[FLAPS.1]
; Leading edge flaps (FM 1-71/1-73): form the leading edge between fuselage and wing-tip fairings; TAKEOFF 15°, LAND 30°.
; Added 2026-10-26 (T3-L) to carry part of the flap lift without stalling the TE flap section (see [FLAPS.0]).
type = 2                          ; leading edge
system_type = 0                   ; [Q] electric (FM 1-73)
span-outboard = 0.95              ; [Q/S] fuselage to tip fairing
extending-time = 5                ; [S]
damaging-speed = 370              ; [Q] FM 3-36, see [FLAPS.0] (was 240 = LAND limit, damaged the TAKEOFF flaps)
blowout-speed = 400               ; [S]
lift_scalar = 1.01                ; [M/S] LAND target split (see [FLAPS.0])
drag_scalar = 0                   ; [S] flap drag already in the TE drag (CR-2144 total)
max_on_ground_position = 2
flaps-position.0 = 0, -1
; 2026-10-30 (B7 preparation): MSFS drives all flap systems with ONE travel fraction (angle / max angle) and stops when
; the first system reaches its stage. TE TAKEOFF 15/45 = 1/3 but LE 15/30 = 1/2 -> extending UP->TAKEOFF gave TE 15 /
; LE 10, retracting LAND->TAKEOFF gave TE 22.6 / LE 15 (hysteresis). Every validated test (T3-D, B4) flew the extending
; path, i.e. LE 10°. -> LE TAKEOFF stage 10° (= 1/3 of 30°): same physics as validated, no hysteresis. Real: 15°.
flaps-position.1 = 10, 370, 1, 1, 1, 0, 0, 1       ; [M] TAKEOFF LE (real 15°, FM 1-73; 10° = MSFS coupling, see above), limit 370 KIAS (FM 3-36)
flaps-position.2 = 30, 240, 1, 1, 1, 0, 0, 1       ; [Q] LAND LE 30°, limit 240 KIAS (FM 5-5)
