; F-104G Starfighter: cockpit.cfg (SOURCE FILE, laid over the SDK template)
; Instrument markings per FM Fig. 5-1 (FM 5-2/5-3, PDF 376/377). The SDK template has 0 everywhere,
; so the external instrument display of the sim showed only zeros at the scale marks.
; Check the display units (EGT: °C or °F?) in the sim.

[RPM]
min = 0
lowLimit = 66                     ; [Q] 66 % minimum
green_start = 87                  ; [Q] 87-104.5 % normal range
green_end = 104.5
yellow_start = 104.5
yellow_end = 107
red_start = 107                   ; [Q] 107 % max. permissible overspeed
red_end = 110
highLimit = 107
max = 110

[TURBINE_NG]
min = 0
lowLimit = 66
green_start = 87
green_end = 104.5
yellow_start = 104.5
yellow_end = 107
red_start = 107
red_end = 110
highLimit = 107
max = 110

[EGT_TEMPERATURE]
min = 0
lowLimit = 50                     ; [Q] 50 °C minimum (-11A)
highLimit = 600                   ; [Q] 600 °C max. continuous (-11A)
max = 1000                        ; [Q] 1000 °C max. permissible overtemperature

[FUEL_FLOW]
min = 0
lowLimit = 400                    ; [Q] 400 lb/h minimum
green_start = 400                 ; [Q] 400-12 000 lb/h normal range
green_end = 12000
highLimit = 12000
max = 12000                       ; [Q] gauge up to 12 000 lb/h

[AIRSPEED]
min = 0
lowLimit = 0
white_start = 121                 ; [Q/calculated] Vs landing configuration (CR-2144: 170 kt = 1.4 Vs)
white_end = 240                   ; [Q] flaps LAND max. 240 KIAS
green_start = 169                 ; [S] Vs clean
green_end = 750
red_start = 750                   ; [Q] 750 KIAS (FM Fig. 5-2)
red_end = 850
highLimit = 750
max = 850                         ; [Q] airspeed indicator up to 850 kt

[FLAPS_LEVELS]
flaps_level_1 = 0
flaps_level_2 = 15                ; [S] TAKEOFF
flaps_level_3 = 45                ; [Q] LAND
flaps_level_4 = DELETE
