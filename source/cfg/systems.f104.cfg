; F-104G Starfighter: Systeme (QUELLDATEI)
; tools/merge_cfg.py legt diese Werte über die SDK-Vorlage (SimpleAircraft) -> common/config/systems.cfg.
; [Q] = Quelle belegt, [M] = gemessen, [S] = Schätzung.

[AUTOPILOT]
; Stabilitätsdämpfer: FM 6-3 (Fig. 6-1) - Gier- und Rollschwingungen werden mit SAS "completely damped"; das SAS
; ist im Normalflug immer an. MSFS bildet das mit dem Gierdämpfer des Autopiloten nach (AP-6).
; Runde D 2026-10-25: mit gain 1.0 gab der Gierdämpfer selbst Seitenruder (2,5°) und rollte den Jet bei positionierten
; Flügen bis 66° Querlage weg; ohne ihn hielt der AP-Flächenhalter sofort. -> AUS bis zur Abstimmung (T3-J, Taumelschwingung)
yaw_damper_gain = 0.0             ; [S] vorerst aus
yaw_damper_rudder_gain = 0.0      ; [S] vorerst aus
